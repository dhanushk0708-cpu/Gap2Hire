[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gap2hire"
version = "0.1.0"
description = "Evidence-based hiring and employee-readiness platform"
requires-python = ">=3.11"
dependencies = [
"fastapi",
"uvicorn[standard]",
"sqlalchemy",
"asyncpg",
"alembic",
"pydantic-settings",
"pwdlib[argon2]",
"PyJWT",
"pydantic-settings",
"pydantic[email]",
]

[project.optional-dependencies]
dev = [
"pytest",
"httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
